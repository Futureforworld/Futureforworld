name: Atualizar vitrine de projetos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório do perfil
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar projetos e sites
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_projects.py

      - name: Publicar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "chore: atualiza vitrine automaticamente"
            git push
          fi

